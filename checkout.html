            const [mode, setMode] = useState("random"); // "random" | "manual"
            const [selectedId, setSelectedId] = useState(SAMPLE_TRANSACTIONS[0].id);
            const [activeTx, setActiveTx] = useState(SAMPLE_TRANSACTIONS[0]);
            const [isProcessing, setIsProcessing] = useState(false);
            const [result, setResult] = useState(null);
            const [showPayload, setShowPayload] = useState(false);
            
            // Modal SMS 2FA (Zona Amarela)
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [smsCode, setSmsCode] = useState("");
            const [smsVerified, setSmsVerified] = useState(false);

            // Estatísticas da sessão
            const [stats, setStats] = useState({ total: 0, approved: 0, challenged: 0, blocked: 0 });

            const handleFinalizarCompra = async () => {
                setIsProcessing(true);
                setSmsVerified(false);

                // 1. Sorteio ou Seleção da Transação
                let currentTx;
                if (mode === "random") {
                    const randomIndex = Math.floor(Math.random() * SAMPLE_TRANSACTIONS.length);
                    currentTx = SAMPLE_TRANSACTIONS[randomIndex];
                    setSelectedId(currentTx.id);
                } else {
                    currentTx = SAMPLE_TRANSACTIONS.find(t => t.id === selectedId) || SAMPLE_TRANSACTIONS[0];
                }
                setActiveTx(currentTx);

                // 2. Prepara o Payload completo (Time, Amount, V1 a V28)
                const payload = {
                    Time: currentTx.Time,
                    Amount: currentTx.Amount
                };
                for (let i = 1; i <= 28; i++) {
                    payload[`V${i}`] = currentTx[`V${i}`] !== undefined ? currentTx[`V${i}`] : 0.0;
                }

                // 3. Envia para o Backend FastAPI (/predict)
                const t0 = performance.now();
                try {
                    const response = await fetch("/predict", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(payload)
                    });
                    const data = await response.json();
                    const t1 = performance.now();
                    const latency = Math.round(t1 - t0);

                    const prob = data.fraud_probability;
                    let zone = "success";
                    let action = "approved";

                    // Regra das 3 Reações de Negócio solicitadas:
                    if (prob >= 0.75) {
                        zone = "danger";
                        action = "blocked";
                    } else if (prob >= 0.50) {
                        zone = "warning";
                        action = "challenge_sms_2fa";
                    } else {
                        zone = "success";
                        action = "approved";
                    }

                    const evaluation = {
                        txId: currentTx.id,
                        description: currentTx.description,
                        is_fraud: data.is_fraud,
                        fraud_probability: prob,
                        risk_zone: zone,
                        action: action,
                        recommendation: data.recommendation,
                        model_name: data.model_name || "BaggingClassifier (RL)",
                        latency: latency
                    };

                    setResult(evaluation);

                    // Atualiza estatísticas
                    setStats(prev => ({
                        total: prev.total + 1,
                        approved: prev.approved + (zone === "success" ? 1 : 0),
                        challenged: prev.challenged + (zone === "warning" ? 1 : 0),
                        blocked: prev.blocked + (zone === "danger" ? 1 : 0)
                    }));

                    // Se caiu na zona amarela, abre o modal de SMS automaticamente!
                    if (zone === "warning") {
                        setIsModalOpen(true);
                        setSmsCode("");
                    }
                } catch (err) {
                    alert("Erro ao consultar a API de Detecção de Fraude: " + err);
                } finally {
                    setIsProcessing(false);
                }
            };

                e.preventDefault();
                if (smsCode.trim().length >= 4) {
                    setIsModalOpen(false);
                    setSmsVerified(true);
                } else {

                    <main class="container py-4" style={{ maxWidth: "1100px" }}>

                        {/* Banner Informativo para o Avaliador */}
                        <div class="card-custom mb-4 p-3 d-flex flex-wrap justify-content-between align-items-center gap-2" style={{ background: "rgba(15, 23, 42, 0.6)" }}>
                            <div class="d-flex align-items-center gap-2">
                                <span class="badge-pill-custom badge-blue font-mono">DEMONSTRAÇÃO DE CHECKOUT</span>
                                <span class="text-secondary small">
                                    Simulação de compra conectada ao modelo <code>BaggingClassifier</code> (5 KB) via API FastAPI Serverless.
                                </span>
                            </div>
                            <div class="d-flex gap-2 font-mono small text-secondary">
                                <span>Aprovadas: <strong class="text-success">{stats.approved}</strong></span> •
                                <span>2FA SMS: <strong class="text-warning">{stats.challenged}</strong></span> •
                                <span>Bloqueadas: <strong class="text-danger">{stats.blocked}</strong></span>
                            </div>
                        </div>

                        <div class="row g-4">
                            {/* COLUNA 1: A VITRINE (PRODUTO & INJEÇÃO DE DADOS) */}
                            <div class="col-lg-6">
                                {/* Card do Produto */}
                                <div class="card-custom mb-4">
                                    <div class="d-flex justify-content-between align-items-start mb-3">
                                        <div>
                                            <span class="badge-pill-custom badge-blue mb-1">LANÇAMENTO EXCLUSIVO</span>
                                            <h2 class="h5 mb-0 fw-bold text-white">Apple iPhone 15 Pro Max 256GB</h2>
                                            <span class="text-secondary small">Titânio Natural • Tela 6.7" OLED Super Retina XDR • Chip A17 Pro</span>
                                        </div>
                                        <span class="badge-pill-custom badge-green">Em Estoque</span>
                                    </div>

                                    {/* Produto Mockup Visual */}
                                    <div class="product-img-box mb-3">
                                        <div style={{ textAlign: "center" }}>
                                            <svg width="84" height="130" viewBox="0 0 84 130" fill="none" xmlns="http://www.w3.org/2000/svg">
                                                <rect x="2" y="2" width="80" height="126" rx="16" fill="#0B132B" stroke="#334155" strokeWidth="3"/>
                                                <rect x="28" y="8" width="28" height="6" rx="3" fill="#1E293B"/>
                                                <rect x="8" y="20" width="68" height="96" rx="10" fill="#020617"/>
                                                <circle cx="42" cy="68" r="14" fill="#22C55E" fillOpacity="0.15" stroke="#22C55E" strokeWidth="1.5"/>
                                                <path d="M37 68L40.5 71.5L47 65" stroke="#22C55E" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>
                                            </svg>
                                            <div class="text-secondary small mt-2 font-mono">MegaLoja Mobile Express</div>
                                        </div>
                                    </div>

                                    {/* Resumo Financeiro */}
                                    <div class="border-top border-bottom py-3 my-3" style={{ borderColor: "var(--color-border) !important" }}>
                                        <div class="d-flex justify-content-between text-secondary small mb-1">
                                            <span>Preço de Tabela:</span>
                                            <span>R$ 9.499,00</span>
                                        </div>
                                        <div class="d-flex justify-content-between text-secondary small mb-1">
                                            <span>Desconto Promocional:</span>
                                            <span class="text-success">- R$ 500,00</span>
                                        </div>
                                        <div class="d-flex justify-content-between text-secondary small mb-2">
                                            <span>Frete com Seguro:</span>
                                            <span class="text-success">GRÁTIS (SEDEX)</span>
                                        </div>
                                        <div class="d-flex justify-content-between align-items-baseline pt-2 border-top" style={{ borderColor: "var(--color-border) !important" }}>
                                            <strong class="text-white">Total do Pedido:</strong>
                                            <span class="h4 mb-0 fw-bold font-mono text-white">R$ 8.999,00</span>
                                        </div>
                                        <div class="text-secondary small text-end font-mono">ou até 10x de R$ 899,90 sem juros</div>
                                    </div>

                                    {/* Botão de Finalizar Compra */}
                                    <button
                                        class="btn-cta w-100"
                                        onClick={handleFinalizarCompra}
                                        disabled={isProcessing}
                                    >
                                        {isProcessing ? (
                                            <>
                                                <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
                                                <span>Avaliando Risco na Nuvem Vercel...</span>
                                            </>
                                        ) : (
                                            <>
                                                <svg class="icon" viewBox="0 0 24 24"><rect width="20" height="14" x="2" y="5" rx="2"/><line x1="2" x2="22" y1="10" y2="10"/></svg>
                                                <span>Finalizar Compra Agora</span>
                                            </>
                                        )}
                                    </button>
                                </div>

                                {/* A INJEÇÃO DE DADOS (OS BASTIDORES) */}
                                <div class="card-custom">
                                    <div class="d-flex justify-content-between align-items-center mb-2">
                                        <h3 class="h6 mb-0 text-white fw-bold d-flex align-items-center gap-2">
                                            <svg class="icon text-info" viewBox="0 0 24 24"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>
                                            Injeção de Dados (15 Amostras do Dataset)
                                        </h3>
                                        <span class="badge-pill-custom badge-neutral font-mono">{mode === "random" ? "Modo: Sorteio" : "Modo: Manual"}</span>
                                    </div>

                                    <p class="text-secondary small mb-3">
                                        Cada clique envia aos bastidores uma transação com <strong>Time, Amount e V1 a V28</strong> diretamente para o modelo.
                                    </p>

                                    {/* Seletor de Modo */}
                                    <div class="d-flex gap-2 mb-3">
                                        <button
                                            class={`btn-secondary-custom flex-grow-1 small ${mode === "random" ? "border-success text-white" : ""}`}
                                            onClick={() => setMode("random")}
                                        >
                                            🎲 Sorteio Aleatório (Padrão)
                                        </button>
                                        <button
                                            class={`btn-secondary-custom flex-grow-1 small ${mode === "manual" ? "border-info text-white" : ""}`}
                                            onClick={() => setMode("manual")}
                                        >
                                            🎯 Seleção Didática Manual
                                        </button>
                                    </div>

                                    {mode === "manual" && (
                                        <div class="mb-3">
                                            <label class="form-label text-secondary small">Escolha a transação de teste:</label>
                                            <select
                                                class="form-select-custom"
                                                value={selectedId}
                                                onChange={(e) => {
                                                    setSelectedId(e.target.value);
                                                    const found = SAMPLE_TRANSACTIONS.find(t => t.id === e.target.value);
                                                    if (found) setActiveTx(found);
                                                }}
                                            >
                                                <optgroup label="🟢 Compras Normais (Score Baixo -> Aprovado)">
                                                    {SAMPLE_TRANSACTIONS.filter(t => t.expected_category === "normal").map(t => (
                                                        <option key={t.id} value={t.id}>{t.id} — {t.description}</option>
                                                    ))}
                                                </optgroup>
                                                <optgroup label="🟡 Zona Amarela (Score Médio -> Desafio SMS 2FA)">
                                                    {SAMPLE_TRANSACTIONS.filter(t => t.expected_category === "yellow_zone").map(t => (
                                                        <option key={t.id} value={t.id}>{t.id} — {t.description}</option>
                                                    ))}
                                                </optgroup>
                                                <optgroup label="🔴 Fraudes Reais (Score Alto -> Bloqueio Imediato)">
                                                    {SAMPLE_TRANSACTIONS.filter(t => t.expected_category === "fraud").map(t => (
                                                        <option key={t.id} value={t.id}>{t.id} — {t.description}</option>
                                                    ))}
                                                </optgroup>
                                            </select>
                                        </div>
                                    )}

                                    {/* Cartão da Transação Ativa */}
                                    <div class="p-3 rounded border" style={{ background: "var(--color-primary)", borderColor: "var(--color-border)" }}>
                                        <div class="d-flex justify-content-between align-items-center mb-1">
                                            <span class="badge-pill-custom badge-neutral font-mono">{activeTx.id}</span>
                                            <span class={`badge-pill-custom ${activeTx.expected_category === "fraud" ? "badge-red" : activeTx.expected_category === "yellow_zone" ? "badge-yellow" : "badge-green"}`}>
                                                {activeTx.category_label}
                                            </span>
                                        </div>
                                        <div class="text-white small fw-bold mb-2">{activeTx.description}</div>
                                        <div class="d-flex justify-content-between font-mono small text-secondary">
                                            <span>Tempo: {activeTx.Time}s</span>
                                            <span>Valor Transação: R$ {activeTx.Amount.toFixed(2)}</span>
                                        </div>
                                    </div>

                                    {/* Toggle Accordion Payload */}
                                    <button
                                        class="btn btn-link text-info text-decoration-none small p-0 mt-2 font-mono"
                                        onClick={() => setShowPayload(!showPayload)}
                                    >
                                        {showPayload ? "▼ Ocultar Componentes PCA (V1..V28)" : "▶ Inspecionar Payload Completo (V1..V28)"}
                                    </button>

                                    {showPayload && (
                                        <pre class="mt-2 p-2 rounded bg-black small font-mono text-secondary" style={{ maxHeight: "150px", overflowY: "auto", fontSize: "0.75rem" }}>
                                            {JSON.stringify(activeTx, null, 2)}
                                        </pre>
                                    )}
                                </div>
                            </div>

                            {/* COLUNA 2: A REAÇÃO VISUAL (O NEGÓCIO) */}
                            <div class="col-lg-6">
                                <div class="card-custom h-100 d-flex flex-column">
                                    <div class="border-bottom pb-3 mb-3 d-flex justify-content-between align-items-center" style={{ borderColor: "var(--color-border) !important" }}>
                                        <div>
                                            <h2 class="h5 mb-0 fw-bold text-white">Parecer do Motor de Decisão</h2>
                                            <span class="text-secondary small font-mono">Resposta em milissegundos da Inteligência Artificial</span>
                                        </div>
                                        {result && (
                                            <span class="badge-pill-custom badge-neutral">
                                                ⚡ Latência: {result.latency} ms
                                            </span>
                                        )}
                                    </div>

                                    {/* Estado 1: Aguardando Clique */}
                                    {!result && !isProcessing && (
                                        <div class="my-auto text-center py-5">
                                            <div style={{ color: "#334155" }}>
                                                <svg class="icon-xl mb-3" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
                                            </div>
                                            <h3 class="h6 text-secondary fw-bold">Aguardando Ação de Compra</h3>
                                            <p class="text-secondary small" style={{ maxWidth: "340px", margin: "0 auto" }}>
                                                Clique em <strong>"Finalizar Compra Agora"</strong> na vitrine para simular a requisição de pagamento e a classificação em tempo real.
                                            </p>
                                        </div>
                                    )}

                                    {/* Estado 2: Processando */}
                                    {isProcessing && (
                                        <div class="my-auto text-center py-5">
                                            <div class="spinner-border text-success mb-3" role="status" style={{ width: "3rem", height: "3rem" }}></div>
                                            <h3 class="h6 text-white fw-bold">Executando Pipeline Antifraude...</h3>
                                            <p class="text-secondary small font-mono">
                                                Normalizando com RobustScaler &bull; BaggingClassifier (Logistic Regression x10)
                                            </p>
                                        </div>
                                    )}

                                    {/* Estado 3: Resultado da Decisão */}
                                    {result && !isProcessing && (
                                        <div class="my-auto py-2">

                                            {/* REAÇÃO A: SCORE BAIXO (< 0.50) -> CHECK VERDE: PAGAMENTO APROVADO */}
                                            {(result.risk_zone === "success" || smsVerified) && (
                                                <div class="p-4 rounded-3 text-center border" style={{ background: "rgba(34, 197, 94, 0.08)", borderColor: "var(--color-accent)", boxShadow: "var(--shadow-glow-accent)" }}>
                                                    <div style={{ color: "var(--color-accent)" }}>
                                                        <svg class="icon-xl mb-2" viewBox="0 0 24 24">
                                                            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
                                                            <polyline points="22 4 12 14.01 9 11.01"/>
                                                        </svg>
                                                    </div>
                                                    <span class="badge-pill-custom badge-green mb-2">SCORE SEGURO</span>
                                                    <h3 class="h4 text-success fw-bold mb-2">Pagamento Aprovado</h3>
                                                    <p class="text-secondary small mb-3">
                                                        {smsVerified 
                                                            ? "Identidade autenticada com sucesso via SMS 2FA. Pedido #ML-20261110 liberado para expedição!"
                                                            : "Transação autorizada com sucesso pelo emissor do cartão. Pedido #ML-20261110 confirmado para envio imediato."}
                                                    </p>

                                                    <div class="p-3 rounded mb-3 text-start font-mono small" style={{ background: "var(--color-primary)", border: "1px solid var(--color-border)" }}>
                                                        <div class="d-flex justify-content-between mb-1">
                                                            <span class="text-secondary">Probabilidade de Fraude:</span>
                                                            <strong class="text-success">{(result.fraud_probability * 100).toFixed(2)}%</strong>
                                                        </div>
                                                        <div class="d-flex justify-content-between mb-1">
                                                            <span class="text-secondary">Limiar do Modelo:</span>
                                                            <span class="text-white">50.00%</span>
                                                        </div>
                                                        <div class="d-flex justify-content-between mb-1">
                                                            <span class="text-secondary">Amostra Utilizada:</span>
                                                            <span class="text-white">{result.txId}</span>
                                                        </div>
                                                        <div class="d-flex justify-content-between">
                                                            <span class="text-secondary">Algoritmo:</span>
                                                            <span class="text-white">{result.model_name}</span>
                                                        </div>
                                                    </div>

                                                    <button class="btn-secondary-custom w-100" onClick={handleFinalizarCompra}>
                                                        <span>Realizar Nova Simulação de Compra</span>
                                                    </button>
                                                </div>
                                            )}

                                            {/* REAÇÃO B: ZONA AMARELA (SCORE MÉDIO 0.50 A 0.74) -> ALERTA DE 2FA SMS */}
                                            {result.risk_zone === "warning" && !smsVerified && (
                                                <div class="p-4 rounded-3 text-center border" style={{ background: "rgba(245, 158, 11, 0.08)", borderColor: "var(--color-warning)", boxShadow: "var(--shadow-glow-warning)" }}>
                                                    <div style={{ color: "var(--color-warning)" }}>
                                                        <svg class="icon-xl mb-2" viewBox="0 0 24 24">
                                                            <circle cx="12" cy="12" r="10"/>
                                                            <line x1="12" y1="8" x2="12" y2="12"/>
                                                            <line x1="12" y1="16" x2="12.01" y2="16"/>
                                                        </svg>
                                                    </div>
                                                    <span class="badge-pill-custom badge-yellow mb-2">ZONA AMARELA • RISCO MODERADO</span>
                                                    <h3 class="h4 text-warning fw-bold mb-2">Atenção: Verificação por SMS</h3>
                                                    <p class="text-secondary small mb-3">
                                                        O sistema identificou um comportamento atípico para esta compra. Um desafio de segurança (2FA) foi disparado via SMS para o titular.
                                                    </p>

                                                    <div class="p-3 rounded mb-3 text-start font-mono small" style={{ background: "var(--color-primary)", border: "1px solid var(--color-border)" }}>
                                                        <div class="d-flex justify-content-between mb-1">
                                                            <span class="text-secondary">Probabilidade de Fraude:</span>
                                                            <strong class="text-warning">{(result.fraud_probability * 100).toFixed(2)}%</strong>
                                                        </div>
                                                        <div class="d-flex justify-content-between mb-1">
                                                            <span class="text-secondary">Faixa de Decisão:</span>
                                                            <span class="text-warning">50% a 74% (Desafio 2FA)</span>
                                                        </div>
                                                        <div class="d-flex justify-content-between">
                                                            <span class="text-secondary">Ação Requerida:</span>
                                                            <span class="text-white">Confirmação de Código SMS</span>
                                                        </div>
                                                    </div>

                                                    <button class="btn-cta w-100" style={{ background: "var(--color-warning)", color: "#000" }} onClick={() => setIsModalOpen(true)}>
                                                        <svg class="icon text-dark" viewBox="0 0 24 24"><rect width="14" height="20" x="5" y="2" rx="2" ry="2"/><line x1="12" x2="12.01" y1="18" y2="18"/></svg>
                                                        <span>Abrir Modal para Inserir Código SMS</span>
                                                    </button>
                                                </div>
                                            )}

                                            {/* REAÇÃO C: FRAUDE CONFIRMADA (SCORE ALTO >= 0.75) -> AVISO VERMELHO: TRANSAÇÃO NEGADA */}
                                            {result.risk_zone === "danger" && (
                                                <div class="p-4 rounded-3 text-center border" style={{ background: "rgba(239, 68, 68, 0.08)", borderColor: "var(--color-destructive)", boxShadow: "var(--shadow-glow-danger)" }}>
                                                    <div style={{ color: "var(--color-destructive)" }}>
                                                        <svg class="icon-xl mb-2" viewBox="0 0 24 24">
                                                            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                                                            <line x1="12" y1="8" x2="12" y2="12"/>
                                                            <line x1="12" y1="16" x2="12.01" y2="16"/>
                                                        </svg>
                                                    </div>
                                                    <span class="badge-pill-custom badge-red mb-2">BLOQUEIO PREVENTIVO</span>
                                                    <h3 class="h4 text-danger fw-bold mb-2">Transação Negada por Política de Segurança</h3>
                                                    <p class="text-secondary small mb-3">
                                                        O motor de Machine Learning identificou desvios severos compatíveis com clonagem e ataque automatizado de cartões de crédito. A transação foi barrada em milissegundos.
                                                    </p>

                                                    <div class="p-3 rounded mb-3 text-start font-mono small" style={{ background: "var(--color-primary)", border: "1px solid var(--color-border)" }}>
                                                        <div class="d-flex justify-content-between mb-1">
                                                            <span class="text-secondary">Probabilidade Calculada:</span>
                                                            <strong class="text-danger">{(result.fraud_probability * 100).toFixed(2)}%</strong>
                                                        </div>
                                                        <div class="d-flex justify-content-between mb-1">
                                                            <span class="text-secondary">Classificação de Risco:</span>
                                                            <span class="text-danger">CRÍTICO (&ge; 75%)</span>
                                                        </div>
                                                        <div class="d-flex justify-content-between mb-1">
                                                            <span class="text-secondary">Amostra Injetada:</span>
                                                            <span class="text-danger">{result.txId}</span>
                                                        </div>
                                                        <div class="d-flex justify-content-between">
                                                            <span class="text-secondary">Decisão Automatizada:</span>
                                                            <span class="text-white">Bloqueio Imediato &bull; Alerta SIEM</span>
                                                        </div>
                                                    </div>

                                                    <button class="btn-secondary-custom w-100" onClick={handleFinalizarCompra}>
                                                        <span>Tentar Outra Transação de Demonstração</span>
                                                    </button>
                                                </div>
                                            )}

                                        </div>
                                    )}

                                    {/* Footer do Card */}
                                    <div class="mt-auto pt-3 border-top text-secondary small font-mono d-flex justify-content-between" style={{ borderColor: "var(--color-border) !important" }}>
                                        <span>MegaLoja S.A. • Antifraude v1.2</span>
                                        <span>FATEC Ourinhos (Prof. Dr. Sidney Ferrari)</span>
                                    </div>
                                </div>
                            </div>
                        </div>

                    </main>

                    {/* MODAL DA ZONA AMARELA: DESAFIO SMS 2FA */}
                    {isModalOpen && (
                        <div class="modal-overlay" onClick={() => setIsModalOpen(false)}>
                            <div class="modal-card" onClick={(e) => e.stopPropagation()}>
                                <div class="text-center mb-3">
                                    <div style={{ color: "var(--color-warning)" }}>
                                        <svg class="icon-xl mb-2" viewBox="0 0 24 24">
                                            <rect width="14" height="20" x="5" y="2" rx="2" ry="2"/>
                                            <line x1="12" x2="12.01" y1="18" y2="18"/>
                                        </svg>
                                    </div>
                                    <span class="badge-pill-custom badge-yellow mb-2">AUTENTICAÇÃO EM 2 ETAPAS (2FA)</span>
                                    <h3 class="h5 text-white fw-bold mb-1">Atenção: Insira o código SMS enviado ao seu celular</h3>
                                    <p class="text-secondary small">
                                        Identificamos um padrão de compra atípico. Enviamos um código de segurança de 6 dígitos para o seu telefone cadastrado com final <strong>(11) 98***-**42</strong>.
                                    </p>
                                </div>

                                <form onSubmit={handleConfirmarSMS}>
                                    <div class="mb-3 text-center">
                                        <label class="form-label text-secondary small font-mono mb-2">Código SMS de Verificação:</label>
                                        <input
                                            type="text"
                                            class="form-input-custom text-center fw-bold fs-4 py-2"
                                            placeholder="Ex: 849204"
                                            maxLength="6"
                                            value={smsCode}
                                            onChange={(e) => setSmsCode(e.target.value)}
                                            autoFocus
                                        />
                                    </div>

                                    <div class="d-flex justify-content-between align-items-center mb-3">
                                        <button type="button" class="btn btn-link text-info text-decoration-none small p-0 font-mono" onClick={fillDemoCode}>
                                            Preencher Código de Teste (849204)
                                        </button>
                                        <span class="text-secondary small font-mono">Expira em 04:59</span>
                                    </div>

                                    <div class="d-flex gap-2">
                                        <button
                                            type="button"
                                            class="btn-secondary-custom flex-grow-1"
                                            onClick={() => setIsModalOpen(false)}
                                        >
                                            Cancelar
                                        </button>
                                        <button
                                            type="submit"
                                            class="btn-cta flex-grow-1"
                                            style={{ background: "var(--color-warning)", color: "#000" }}
                                        >
                                            Confirmar Código SMS
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
</body>
</html>
